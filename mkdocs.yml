site_name: hugging-mac
site_description: User and Python SDK documentation for the Hugging Mac local model studio
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Getting started: getting-started.md
  - Model Library: model-library.md
  - Studio: studio.md
  - Python SDK:
      - SDK guide: sdk/README.md
      - Model reference: sdk/models/README.md
      - Audio and speech:
          - Audio8 ASR: sdk/models/audio8-asr.md
          - Audio8 TTS: sdk/models/audio8-tts.md
          - DeepFilterNet3: sdk/models/deepfilternet3.md
          - Kokoro: sdk/models/kokoro.md
          - Nemotron 3.5 ASR: sdk/models/nemotron-3.5-asr.md
          - Qwen3 ASR: sdk/models/qwen3-asr.md
          - Qwen3 TTS: sdk/models/qwen3-tts.md
          - SenseVoice: sdk/models/sensevoice.md
          - Silero VAD: sdk/models/silero-vad.md
      - Language and multimodal:
          - Gemma 4: sdk/models/gemma-4.md
          - Qwen3.5: sdk/models/qwen3.5.md
      - Vision:
          - MediaPipe Hand Detection: sdk/models/mediapipe-hand-detection.md
          - RetinaFace: sdk/models/retinaface.md
          - YOLOv8: sdk/models/yolov8.md
          - YOLOv8 Pose: sdk/models/yolov8-pose.md
          - YOLOv8 Seg: sdk/models/yolov8-seg.md

strict: true
