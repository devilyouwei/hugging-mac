[project]
name = "hugging-mac-web"
version = "0.1.0"
description = "Local FastAPI platform backend for hugging-mac"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "hugging-mac-sdk[asr,layout,llm,ocr,tts,yolo]",
  "pymupdf>=1.26,<2",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "structlog>=25,<26",
  "tinydb>=4.8,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/devilyouwei/hugging-mac"

[project.scripts]
hugging-mac-web = "hugging_mac_web.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugging_mac_web"]

[tool.uv.sources]
hugging-mac-sdk = { workspace = true }
