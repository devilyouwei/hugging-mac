manifest:
  schema_version: '1'
  model_id: ultralytics/yolov8-pose
  display_name: Ultralytics YOLOv8 Pose
  description: 基于 COCO 17 关键点的人体姿态估计模型。
  tags: [vision, pose-estimation, yolo]
  family: yolov8
  capabilities: [pose-estimation]
  source_url: https://github.com/ultralytics/assets/releases/tag/v8.2.0
  license: AGPL-3.0

  runtimes:
  - name: pytorch-mps
    devices: [mps, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch]
  - name: coreml
    devices: [all, cpu-and-gpu, cpu-and-neural-engine, cpu-only]
    dtypes: [float16, float32]
    quantizations: [float16, int8]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools]
  - name: onnx
    devices: [coreml, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [onnxruntime]
  default_runtime: coreml
  variants:
  - name: n
    display_name: YOLOv8 Pose Nano
    description: 轻量人体姿态估计权重。
    metadata:
      source_size_bytes: 6832633
  - name: s
    display_name: YOLOv8 Pose Small
    description: 平衡速度和精度的人体姿态估计权重。
    metadata:
      source_size_bytes: 23513657
  - name: m
    display_name: YOLOv8 Pose Medium
    description: 更高精度的人体姿态估计权重。
    metadata:
      source_size_bytes: 53266977
  default_variant: n

artifacts:
- artifact_id: source
  variant: n
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-pose/n/pytorch-mps/source/yolov8n-pose.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n-pose.pt
- artifact_id: coreml
  convert: true
  variant: n
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-pose/n/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-pose-coreml
    allow_patterns:
    - yolov8n-pose.mlpackage/Manifest.json
    - yolov8n-pose.mlpackage/Data/**
    strip_prefix: yolov8n-pose.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: n
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-pose/n/onnx/onnx/yolov8n-pose.onnx
- artifact_id: source
  variant: s
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-pose/s/pytorch-mps/source/yolov8s-pose.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8s-pose.pt
- artifact_id: coreml
  convert: true
  variant: s
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-pose/s/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-pose-coreml
    allow_patterns:
    - yolov8s-pose.mlpackage/Manifest.json
    - yolov8s-pose.mlpackage/Data/**
    strip_prefix: yolov8s-pose.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: s
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-pose/s/onnx/onnx/yolov8s-pose.onnx
- artifact_id: source
  variant: m
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-pose/m/pytorch-mps/source/yolov8m-pose.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8m-pose.pt
- artifact_id: coreml
  convert: true
  variant: m
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-pose/m/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-pose-coreml
    allow_patterns:
    - yolov8m-pose.mlpackage/Manifest.json
    - yolov8m-pose.mlpackage/Data/**
    strip_prefix: yolov8m-pose.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: m
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-pose/m/onnx/onnx/yolov8m-pose.onnx
