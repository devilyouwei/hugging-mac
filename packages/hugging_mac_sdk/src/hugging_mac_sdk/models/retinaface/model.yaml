manifest:
  schema_version: '1'
  model_id: py-feat/retinaface
  display_name: RetinaFace MobileNet0.25
  description: py-feat 的轻量 RetinaFace，单次推理输出人脸框和五点关键点。
  tags: [vision, face-detection, face-landmarks, pytorch, coreml, mobilenet]
  family: retinaface
  capabilities: [face-detection]
  source_url: https://huggingface.co/py-feat/retinaface
  license: MIT

  runtimes:
  - name: pytorch-mps
    devices: [mps, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch]
  - name: coreml
    devices: [all, cpu-and-gpu, cpu-and-neural-engine, cpu-only]
    dtypes: [float16, float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools, numpy]
  default_runtime: coreml
  variants:
  - name: mobilenet0.25
    display_name: MobileNet0.25
    description: 约 43 万参数的轻量 RetinaFace，输入默认 640×640。
    metadata:
      parameters: 426608
      landmarks: 5
      input_size: 640
  default_variant: mobilenet0.25

artifacts:
- artifact_id: source
  variant: mobilenet0.25
  runtime: pytorch-mps
  format: pytorch
  kind: directory
  path: py-feat/retinaface/mobilenet0.25/pytorch-mps/source
  required_files: [config.json, mobilenet0.25_Final.pth]
  source:
    kind: huggingface
    repo_id: py-feat/retinaface
    allow_patterns:
    - config.json
    - mobilenet0.25_Final.pth
- artifact_id: coreml-fp16
  convert: true
  variant: mobilenet0.25
  runtime: coreml
  format: coreml
  kind: directory
  path: py-feat/retinaface/mobilenet0.25/coreml/coreml-fp16
  source:
    kind: huggingface
    repo_id: hugging-mac/retinaface-coreml
    allow_patterns:
    - retinaface.mlpackage/Manifest.json
    - retinaface.mlpackage/Data/**
    strip_prefix: retinaface.mlpackage
  required_files: [Manifest.json]
