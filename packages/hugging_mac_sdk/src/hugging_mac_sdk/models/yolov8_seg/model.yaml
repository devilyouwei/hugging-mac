manifest:
  schema_version: '1'
  model_id: ultralytics/yolov8-seg
  display_name: Ultralytics YOLOv8 Seg
  description: 为每个检测目标输出实例轮廓的 YOLOv8 分割模型。
  tags: [vision, instance-segmentation, yolo]
  family: yolov8
  capabilities: [instance-segmentation]
  source_url: https://github.com/ultralytics/assets/releases/tag/v8.2.0
  license: AGPL-3.0

  runtimes:
  - name: pytorch-mps
    devices: [mps, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch]
  - name: coreml
    devices: [all, cpu-and-gpu, cpu-and-neural-engine, cpu-only]
    dtypes: [float16, float32]
    quantizations: [float16, int8]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools]
  - name: onnx
    devices: [coreml, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [onnxruntime]
  default_runtime: coreml
  variants:
  - name: n
    display_name: YOLOv8 Seg Nano
    description: 轻量实例分割权重。
    metadata:
      source_size_bytes: 7071756
  - name: s
    display_name: YOLOv8 Seg Small
    description: 平衡速度和精度的实例分割权重。
    metadata:
      source_size_bytes: 23914764
  - name: m
    display_name: YOLOv8 Seg Medium
    description: 更高精度的实例分割权重。
    metadata:
      source_size_bytes: 54921020
  default_variant: n

artifacts:
- artifact_id: source
  variant: n
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-seg/n/pytorch-mps/source/yolov8n-seg.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n-seg.pt
- artifact_id: coreml
  convert: true
  variant: n
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-seg/n/coreml/coreml
  required_files: [Manifest.json]
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-seg-coreml
    allow_patterns:
    - yolov8n-seg.mlpackage/Manifest.json
    - yolov8n-seg.mlpackage/Data/**
    strip_prefix: yolov8n-seg.mlpackage
- artifact_id: onnx
  convert: true
  variant: n
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-seg/n/onnx/onnx/yolov8n-seg.onnx
- artifact_id: source
  variant: s
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-seg/s/pytorch-mps/source/yolov8s-seg.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8s-seg.pt
- artifact_id: coreml
  convert: true
  variant: s
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-seg/s/coreml/coreml
  required_files: [Manifest.json]
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-seg-coreml
    allow_patterns:
    - yolov8s-seg.mlpackage/Manifest.json
    - yolov8s-seg.mlpackage/Data/**
    strip_prefix: yolov8s-seg.mlpackage
- artifact_id: onnx
  convert: true
  variant: s
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-seg/s/onnx/onnx/yolov8s-seg.onnx
- artifact_id: source
  variant: m
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8-seg/m/pytorch-mps/source/yolov8m-seg.pt
  source:
    kind: url_file
    url: https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8m-seg.pt
- artifact_id: coreml
  convert: true
  variant: m
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8-seg/m/coreml/coreml
  required_files: [Manifest.json]
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-seg-coreml
    allow_patterns:
    - yolov8m-seg.mlpackage/Manifest.json
    - yolov8m-seg.mlpackage/Data/**
    strip_prefix: yolov8m-seg.mlpackage
- artifact_id: onnx
  convert: true
  variant: m
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8-seg/m/onnx/onnx/yolov8m-seg.onnx
