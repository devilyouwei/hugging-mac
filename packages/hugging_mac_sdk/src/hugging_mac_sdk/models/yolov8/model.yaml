manifest:
  schema_version: '1'
  model_id: ultralytics/yolov8
  display_name: Ultralytics YOLOv8
  description: 共享检测结构和输入输出协议、支持多种权重规模的实时 COCO 目标检测模型。
  tags: [vision, object-detection, yolo]
  family: yolov8
  capabilities: [object-detection]
  source_url: https://huggingface.co/Ultralytics/YOLOv8
  license: AGPL-3.0

  runtimes:
  - name: pytorch-mps
    devices: [mps, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch]
  - name: coreml
    devices: [all, cpu-and-gpu, cpu-and-neural-engine, cpu-only]
    dtypes: [float16, float32]
    quantizations: [float16, int8]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools]
  - name: onnx
    devices: [coreml, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [onnxruntime]
  default_runtime: coreml
  variants:
  - name: n
    display_name: YOLOv8 Nano
    description: 最小、最快的 YOLOv8 检测权重。
    metadata:
      parameters_millions: 3.2
      source_size_bytes: 6534387
  - name: s
    display_name: YOLOv8 Small
    description: 在速度和精度之间取得平衡的较小权重。
    metadata:
      parameters_millions: 11.2
      source_size_bytes: 22573363
  - name: m
    display_name: YOLOv8 Medium
    description: 更高精度、计算和内存开销更高的中型权重。
    metadata:
      parameters_millions: 25.9
      source_size_bytes: 52117635
  default_variant: n

artifacts:
- artifact_id: source
  variant: n
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8/n/pytorch-mps/source/yolov8n.pt
  source:
    kind: huggingface
    repo_id: Ultralytics/YOLOv8
    filename: yolov8n.pt
- artifact_id: coreml
  convert: true
  variant: n
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8/n/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-coreml
    allow_patterns:
    - yolov8n.mlpackage/Manifest.json
    - yolov8n.mlpackage/Data/**
    strip_prefix: yolov8n.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: n
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8/n/onnx/onnx/yolov8n.onnx
- artifact_id: source
  variant: s
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8/s/pytorch-mps/source/yolov8s.pt
  source:
    kind: huggingface
    repo_id: Ultralytics/YOLOv8
    filename: yolov8s.pt
- artifact_id: coreml
  convert: true
  variant: s
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8/s/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-coreml
    allow_patterns:
    - yolov8s.mlpackage/Manifest.json
    - yolov8s.mlpackage/Data/**
    strip_prefix: yolov8s.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: s
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8/s/onnx/onnx/yolov8s.onnx
- artifact_id: source
  variant: m
  runtime: pytorch-mps
  format: pytorch
  kind: file
  path: ultralytics/yolov8/m/pytorch-mps/source/yolov8m.pt
  source:
    kind: huggingface
    repo_id: Ultralytics/YOLOv8
    filename: yolov8m.pt
- artifact_id: coreml
  convert: true
  variant: m
  runtime: coreml
  format: coreml
  kind: directory
  path: ultralytics/yolov8/m/coreml/coreml
  source:
    kind: huggingface
    repo_id: hugging-mac/yolov8-coreml
    allow_patterns:
    - yolov8m.mlpackage/Manifest.json
    - yolov8m.mlpackage/Data/**
    strip_prefix: yolov8m.mlpackage
  required_files: [Manifest.json]
- artifact_id: onnx
  convert: true
  variant: m
  runtime: onnx
  format: onnx
  kind: file
  path: ultralytics/yolov8/m/onnx/onnx/yolov8m.onnx
