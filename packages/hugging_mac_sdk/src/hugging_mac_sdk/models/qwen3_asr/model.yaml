manifest:
  schema_version: '1'
  model_id: qwen/qwen3-asr
  display_name: Qwen3-ASR
  description: Qwen3-ASR 0.6B 的预编译 Core ML encoder、embedding 与有状态分片 decoder。
  tags: [audio, asr, multilingual, coreml, int8, ane, stateful]
  family: qwen3-asr
  capabilities: [speech-transcription]
  source_url: https://huggingface.co/aufklarer/Qwen3-ASR-CoreML
  license: Apache-2.0

  runtimes:
  - name: coreml
    devices: [ane, gpu, cpu]
    dtypes: [int8, float16, float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools, numpy, transformers]
  default_runtime: coreml
  variants:
  - name: 0.6b
    display_name: Qwen3-ASR 0.6B INT8 Core ML
    metadata:
      parameters_millions: 600
      sample_rate: 16000
      max_audio_seconds: 30
      decoder_context: 1024
      minimum_macos: '15.0'
  default_variant: 0.6b

artifacts:
- artifact_id: coreml-int8
  variant: 0.6b
  runtime: coreml
  format: coreml
  kind: directory
  path: qwen/qwen3-asr/0.6b/coreml/coreml-int8
  required_files: [encoder.mlmodelc/model.mil, embedding.mlmodelc/model.mil, decoder_part1.mlmodelc/model.mil, decoder_part2.mlmodelc/model.mil,
    config.json]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: aufklarer/Qwen3-ASR-CoreML
    allow_patterns:
    - encoder.mlmodelc/**
    - embedding.mlmodelc/**
    - decoder_part1.mlmodelc/**
    - decoder_part2.mlmodelc/**
    - config.json
- artifact_id: tokenizer
  shared: true
  format: tokenizer
  kind: directory
  path: qwen/qwen3-asr/_shared/tokenizer
  required_files: [vocab.json, merges.txt, tokenizer_config.json]
  source:
    kind: huggingface
    repo_id: Qwen/Qwen3-ASR-0.6B
    allow_patterns:
    - vocab.json
    - merges.txt
    - tokenizer_config.json
