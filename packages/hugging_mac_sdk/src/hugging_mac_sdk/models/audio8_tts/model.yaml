manifest:
  schema_version: '1'
  model_id: audio8/audio8-tts-preview
  display_name: Audio8 TTS Preview
  description: 支持多语言与零样本声音克隆的 Audio8 TTS 模型。
  tags: [audio, tts, voice-cloning, zero-shot, multilingual, arktts]
  family: audio8-tts
  capabilities: [speech-synthesis]
  source_url: https://huggingface.co/Edge0/Audio8-TTS-Preview-0.1b
  license: audio8-community-license-v1.0

  runtimes:
  - name: pytorch
    devices: [cpu, mps]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch, torchaudio, transformers, safetensors, numpy, soundfile]
  - name: mlx
    devices: [gpu]
    dtypes: [bfloat16, float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [mlx, mlx_audio, numpy]
  - name: coreai
    devices: [auto, cpu]
    dtypes: [float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coreai, torch, torchaudio, transformers, safetensors, numpy, soundfile]
  default_runtime: pytorch
  variants:
  - name: 0.1b-preview
    display_name: Audio8 TTS Preview 0.1B
    description: 约 170M 参数的紧凑主模型，支持中英文及 6 种实验语言的零样本声音克隆。
    metadata:
      parameters: 169779904
      model_weight_size_bytes: 339605208
      codec_weight_size_bytes: 1349857559
      sample_rate: 44100
      context_positions: 2048
      recommended_languages: 2
      experimental_languages: 6
      license: audio8-community-license-v1.0
  - name: 0.6b-preview
    display_name: Audio8 TTS Preview 0.6B
    description: 包含 0.6B DualAR 主模型与 44.1 kHz 神经音频 codec 的 BF16 预览权重。
    metadata:
      parameters: 601159424
      model_weight_size_bytes: 1202342528
      codec_weight_size_bytes: 1349857559
      sample_rate: 44100
      context_positions: 2048
      recommended_languages: 11
      license: Apache-2.0
  default_variant: 0.1b-preview

artifacts:
- artifact_id: source
  variant: 0.1b-preview
  runtime: pytorch
  format: safetensors
  kind: directory
  path: audio8/audio8-tts-preview/0.1b-preview/pytorch/source
  required_files: [codec.pth, config.json, configuration_arktts.py, generation_config.json, model.safetensors, modeling_arktts.py,
    modeling_arktts_codec.py, preprocessor_config.json, processing_arktts.py, processor_config.json]
  required_shares: [tokenizer-0.1b]
  source:
    kind: huggingface
    repo_id: Edge0/Audio8-TTS-Preview-0.1b
    allow_patterns:
    - config.json
    - generation_config.json
    - preprocessor_config.json
    - processor_config.json
    - '*.py'
    - '*.pth'
    - '*.safetensors'
- artifact_id: source
  variant: 0.6b-preview
  runtime: pytorch
  format: safetensors
  kind: directory
  path: audio8/audio8-tts-preview/0.6b-preview/pytorch/source
  required_files: [codec.pth, config.json, configuration_arktts.py, generation_config.json, model.safetensors, modeling_arktts.py,
    modeling_arktts_codec.py, preprocessor_config.json, processing_arktts.py, processor_config.json]
  required_shares: [tokenizer-0.6b]
  source:
    kind: huggingface
    repo_id: Audio8/Audio8-TTS-Preview-0.6b
    allow_patterns:
    - config.json
    - generation_config.json
    - preprocessor_config.json
    - processor_config.json
    - '*.py'
    - '*.pth'
    - '*.safetensors'
- artifact_id: mlx-bf16
  variant: 0.6b-preview
  runtime: mlx
  format: mlx
  kind: directory
  path: audio8/audio8-tts-preview/0.6b-preview/mlx/mlx-bf16
  required_files: [codec.safetensors, config.json, generation_config.json, model.safetensors]
  required_shares: [tokenizer-0.6b]
  source:
    kind: huggingface
    repo_id: mlx-community/Audio8-TTS-Preview-0.6b-bf16
    allow_patterns:
    - config.json
    - generation_config.json
    - codec.safetensors
    - model.safetensors
- artifact_id: coreai-hybrid
  convert: true
  variant: 0.1b-preview
  runtime: coreai
  format: coreai
  kind: directory
  path: audio8/audio8-tts-preview/0.1b-preview/coreai/coreai-hybrid
  required_files: [fast.aimodel/metadata.json, fast.aimodel/main.mlirb, fast.aimodel/main.hash,
    codec.aimodel/metadata.json, codec.aimodel/main.mlirb, codec.aimodel/main.hash,
    pytorch/codec.pth, pytorch/config.json, pytorch/configuration_arktts.py, pytorch/generation_config.json,
    pytorch/model.safetensors, pytorch/modeling_arktts.py, pytorch/modeling_arktts_codec.py,
    pytorch/preprocessor_config.json, pytorch/processing_arktts.py, pytorch/processor_config.json]
  required_shares: [tokenizer-0.1b]
  source:
    kind: huggingface
    repo_id: hugging-mac/audio8-tts-0.1b-coreai
    allow_patterns:
    - 0.1b-preview/coreai/coreai-hybrid/fast.aimodel/**
    - 0.1b-preview/coreai/coreai-hybrid/codec.aimodel/**
    - 0.1b-preview/coreai/coreai-hybrid/pytorch/**
    strip_prefix: 0.1b-preview/coreai/coreai-hybrid
- artifact_id: tokenizer-0.1b
  shared: true
  format: tokenizer
  kind: directory
  path: audio8/audio8-tts-preview/_shared/tokenizer-0.1b
  required_files: [special_tokens_map.json, tokenizer.json, tokenizer_config.json]
  source:
    kind: huggingface
    repo_id: hugging-mac/audio8-tts-0.1b-coreai
    allow_patterns:
    - _shared/tokenizer-0.1b/special_tokens_map.json
    - _shared/tokenizer-0.1b/tokenizer.json
    - _shared/tokenizer-0.1b/tokenizer_config.json
    strip_prefix: _shared/tokenizer-0.1b
- artifact_id: tokenizer-0.6b
  shared: true
  format: tokenizer
  kind: directory
  path: audio8/audio8-tts-preview/_shared/tokenizer-0.6b
  required_files: [special_tokens_map.json, tokenizer.json, tokenizer_config.json]
  source:
    kind: huggingface
    repo_id: Audio8/Audio8-TTS-Preview-0.6b
    allow_patterns:
    - special_tokens_map.json
    - tokenizer.json
    - tokenizer_config.json
extensions:
  audio8_tts_coreai:
    source_artifact: source
    target_artifact: coreai-hybrid
    fast_graph: fast.aimodel
    codec_graph: codec.aimodel
    pytorch_directory: pytorch
    codec_max_frames: 2048
    stages:
      fast_ar: coreai
      codec_decode: coreai
      slow_ar: pytorch-cpu
      reference_encode: pytorch-cpu
