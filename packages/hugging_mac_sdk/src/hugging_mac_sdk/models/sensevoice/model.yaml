manifest:
  schema_version: '1'
  model_id: funaudiollm/sensevoice
  display_name: SenseVoiceSmall
  description: 非自回归多语言语音理解模型，支持转写、语种、情感和音频事件识别。
  tags: [audio, asr, speech-understanding, emotion-recognition, audio-event-detection]
  family: sensevoice
  capabilities: [speech-transcription, speech-understanding]
  source_url: https://huggingface.co/FunAudioLLM/SenseVoiceSmall
  license: FunASR-Model-License-1.1

  runtimes:
  - name: pytorch-mps
    devices: [mps, cpu]
    dtypes: [float16, float32]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [torch, torchaudio, sentencepiece, numpy, soundfile, scipy]
  - name: coreml
    devices: [cpu-and-neural-engine, all, cpu-and-gpu, cpu-only]
    dtypes: [float16]
    quantizations: [float16, int8]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [coremltools, torch, torchaudio, sentencepiece, numpy, soundfile, scipy]
  default_runtime: pytorch-mps
  variants:
  - name: small
    display_name: SenseVoiceSmall
    description: 50 层主 SANM encoder、20 层 text-prompt encoder 的原始 PyTorch 权重。
    metadata:
      weight_size_bytes: 936291369
      max_audio_seconds: 30
      sample_rate: 16000
      architecture: non-autoregressive-sanm-ctc
  default_variant: small

artifacts:
- artifact_id: source
  variant: small
  runtime: pytorch-mps
  format: pytorch
  kind: directory
  path: funaudiollm/sensevoice/small/pytorch-mps/source
  required_files: [model.pt, config.yaml, configuration.json, am.mvn]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: FunAudioLLM/SenseVoiceSmall
    allow_patterns:
    - model.pt
    - config.yaml
    - configuration.json
    - am.mvn
- artifact_id: coreml
  convert: true
  variant: small
  runtime: coreml
  format: coreml
  kind: directory
  path: funaudiollm/sensevoice/small/coreml/coreml
  required_files: [sensevoice.mlpackage, am.mvn, conversion.json]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: hugging-mac/sensevoice-small-coreml
    allow_patterns:
    - sensevoice-small-coreml/sensevoice.mlpackage/**
    - sensevoice-small-coreml/am.mvn
    - sensevoice-small-coreml/conversion.json
    strip_prefix: sensevoice-small-coreml
- artifact_id: tokenizer
  shared: true
  format: tokenizer
  kind: directory
  path: funaudiollm/sensevoice/_shared/tokenizer
  required_files: [chn_jpn_yue_eng_ko_spectok.bpe.model]
  source:
    kind: huggingface
    repo_id: FunAudioLLM/SenseVoiceSmall
    allow_patterns:
    - chn_jpn_yue_eng_ko_spectok.bpe.model
