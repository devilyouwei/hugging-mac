manifest:
  schema_version: '1'
  model_id: google/gemma-4
  display_name: Gemma 4
  description: Apple Silicon Gemma 4 multimodal chat models using QAT OptiQ mixed precision.
  tags: [llm, vlm, chat, gemma-4, mlx, qat, optiq, 4bit]
  family: gemma-4
  capabilities: [chat]
  source_url: https://huggingface.co/google/gemma-4-E4B-it
  license: Apache-2.0

  runtimes:
  - name: mlx
    devices: [gpu]
    dtypes: [uint4, uint8, bfloat16]
    quantizations: [4bit]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [mlx, mlx_vlm]
  default_runtime: mlx
  variants:
  - name: e4b
    display_name: Gemma 4 E4B IT QAT OptiQ 4-bit
    description: E4B instruction-tuned QAT checkpoint with OptiQ mixed precision and a vision sidecar.
    metadata:
      effective_parameter_count_billions: 4.5
      total_parameter_count_billions: 8
      quantization_bits: 4
      bits_per_weight: 5.17
      quantization_group_size: 64
      disk_size_bytes: 8467311462
      multimodal: true
      quantization_method: optiq
      quantization_aware_trained: true
      mixed_precision_8bit_components: 221
      mixed_precision_4bit_components: 122
  - name: e2b
    display_name: Gemma 4 E2B IT QAT OptiQ 4-bit
    description: E2B instruction-tuned QAT checkpoint with OptiQ mixed precision and a vision sidecar.
    metadata:
      effective_parameter_count_billions: 2.3
      total_parameter_count_billions: 5.1
      quantization_bits: 4
      quantization_group_size: 64
      disk_size_bytes: 6205876170
      multimodal: true
      quantization_method: optiq
      quantization_aware_trained: true
  default_variant: e4b

artifacts:
- artifact_id: mlx-optiq-4bit
  variant: e4b
  runtime: mlx
  format: mlx
  kind: directory
  path: google/gemma-4/e4b/mlx/mlx-optiq-4bit
  required_files: [config.json, generation_config.json, model-00001-of-00002.safetensors, model-00002-of-00002.safetensors,
    model.safetensors.index.json, optiq/optiq_vision.safetensors, optiq_metadata.json, chat_template.jinja]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: mlx-community/gemma-4-e4b-it-qat-OptiQ-4bit
    allow_patterns:
    - config.json
    - generation_config.json
    - model*.safetensors
    - model.safetensors.index.json
    - optiq_metadata.json
    - chat_template.jinja
    - optiq/*.safetensors
- artifact_id: mlx-optiq-4bit
  variant: e2b
  runtime: mlx
  format: mlx
  kind: directory
  path: google/gemma-4/e2b/mlx/mlx-optiq-4bit
  required_files: [config.json, generation_config.json, model.safetensors, model.safetensors.index.json, optiq/optiq_vision.safetensors,
    optiq_metadata.json, chat_template.jinja]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: mlx-community/gemma-4-e2b-it-qat-OptiQ-4bit
    allow_patterns:
    - config.json
    - generation_config.json
    - model*.safetensors
    - model.safetensors.index.json
    - optiq_metadata.json
    - chat_template.jinja
    - optiq/*.safetensors
- artifact_id: tokenizer
  shared: true
  format: tokenizer
  kind: directory
  path: google/gemma-4/_shared/tokenizer
  required_files: [tokenizer.json, tokenizer_config.json]
  source:
    kind: huggingface
    repo_id: mlx-community/gemma-4-e4b-it-qat-OptiQ-4bit
    allow_patterns:
    - tokenizer.json
    - tokenizer_config.json
