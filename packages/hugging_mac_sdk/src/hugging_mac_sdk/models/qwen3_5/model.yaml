manifest:
  schema_version: '1'
  model_id: qwen/qwen3.5
  display_name: Qwen3.5
  description: Apple Silicon Qwen3.5 multimodal chat models in OptiQ mixed-precision variants.
  tags: [llm, vlm, chat, qwen3.5, mlx, 4bit]
  family: qwen3.5
  capabilities: [chat, vision-language-generation]
  source_url: https://huggingface.co/mlx-community/Qwen3.5-9B-OptiQ-4bit
  license: Apache-2.0

  runtimes:
  - name: mlx
    devices: [gpu]
    dtypes: [uint4, uint8, bfloat16]
    quantizations: [4bit]
    platforms: [darwin]
    architectures: [arm64]
    required_modules: [mlx, mlx_vlm]
  default_runtime: mlx
  variants:
  - name: 9b
    display_name: Qwen3.5 9B OptiQ 4-bit
    description: OptiQ mixed-precision four-bit checkpoint with a visual-weight sidecar.
    metadata:
      parameter_count_billions: 9
      quantization_bits: 4
      quantization_group_size: 64
      disk_size_bytes: 6600000000
      multimodal: true
      quantization_method: optiq
      mixed_precision_8bit_layers: 132
      mixed_precision_4bit_layers: 116
  - name: 4b
    display_name: Qwen3.5 4B OptiQ 4-bit
    description: OptiQ mixed-precision four-bit checkpoint with a visual-weight sidecar.
    metadata:
      parameter_count_billions: 4
      quantization_bits: 4
      quantization_group_size: 64
      disk_size_bytes: 3000000000
      multimodal: true
      quantization_method: optiq
      mixed_precision_8bit_layers: 75
      mixed_precision_4bit_layers: 173
  - name: 2b
    display_name: Qwen3.5 2B OptiQ 4-bit
    description: Compact OptiQ mixed-precision four-bit checkpoint with a visual-weight sidecar.
    metadata:
      parameter_count_billions: 2
      quantization_bits: 4
      quantization_group_size: 64
      disk_size_bytes: 1400000000
      multimodal: true
      quantization_method: optiq
      mixed_precision_8bit_layers: 56
      mixed_precision_4bit_layers: 130
  default_variant: 9b

artifacts:
- artifact_id: mlx-optiq-4bit
  variant: 9b
  runtime: mlx
  format: mlx
  kind: directory
  path: qwen/qwen3.5/9b/mlx/mlx-optiq-4bit
  required_files: [config.json, model-00001-of-00002.safetensors, model-00002-of-00002.safetensors, model.safetensors.index.json,
    optiq/mtp.safetensors, optiq/optiq_vision.safetensors, optiq_metadata.json, chat_template.jinja]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    allow_patterns:
    - config.json
    - generation_config.json
    - kv_config.json
    - model*.safetensors
    - model.safetensors.index.json
    - optiq_metadata.json
    - chat_template.jinja
    - optiq/*.safetensors
- artifact_id: mlx-optiq-4bit
  variant: 4b
  runtime: mlx
  format: mlx
  kind: directory
  path: qwen/qwen3.5/4b/mlx/mlx-optiq-4bit
  required_files: [config.json, model.safetensors, model.safetensors.index.json, optiq/mtp.safetensors, optiq/optiq_vision.safetensors,
    optiq_metadata.json, chat_template.jinja]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: mlx-community/Qwen3.5-4B-OptiQ-4bit
    allow_patterns:
    - config.json
    - generation_config.json
    - kv_config.json
    - model*.safetensors
    - model.safetensors.index.json
    - optiq_metadata.json
    - chat_template.jinja
    - optiq/*.safetensors
- artifact_id: mlx-optiq-4bit
  variant: 2b
  runtime: mlx
  format: mlx
  kind: directory
  path: qwen/qwen3.5/2b/mlx/mlx-optiq-4bit
  required_files: [config.json, model.safetensors, model.safetensors.index.json, optiq/mtp.safetensors, optiq/optiq_vision.safetensors,
    optiq_metadata.json, chat_template.jinja]
  required_shares: [tokenizer]
  source:
    kind: huggingface
    repo_id: mlx-community/Qwen3.5-2B-OptiQ-4bit
    allow_patterns:
    - config.json
    - generation_config.json
    - kv_config.json
    - model*.safetensors
    - model.safetensors.index.json
    - optiq_metadata.json
    - chat_template.jinja
    - optiq/*.safetensors
- artifact_id: tokenizer
  shared: true
  format: tokenizer
  kind: directory
  path: qwen/qwen3.5/_shared/tokenizer
  required_files: [tokenizer.json, tokenizer_config.json]
  source:
    kind: huggingface
    repo_id: mlx-community/Qwen3.5-9B-OptiQ-4bit
    allow_patterns:
    - tokenizer.json
    - tokenizer_config.json
