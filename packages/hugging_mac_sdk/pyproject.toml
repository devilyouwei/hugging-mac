[project]
name = "hugging-mac-sdk"
version = "0.1.0"
description = "Runtime-neutral model SDK for hugging-mac"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=0.33,<2",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
]

[project.urls]
Repository = "https://github.com/devilyouwei/hugging-mac"

[project.optional-dependencies]
asr = [
  "numpy>=2,<2.4",
  "safetensors>=0.5,<1",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "torch>=2.7,<3",
  "transformers>=4.57.3,<6",
]
yolo = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<2.4",
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "opencv-python>=4.11,<5",
  "torch>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugging_mac_sdk"]
