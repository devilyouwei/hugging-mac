[project]
name = "hugging-mac-sdk"
version = "0.1.0"
description = "Runtime-neutral model SDK for hugging-mac"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=0.33,<2",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "tqdm>=4.42,<5",
]

[project.urls]
Repository = "https://github.com/devilyouwei/hugging-mac"

[project.optional-dependencies]
llm = [
  "mlx-vlm>=0.6.3,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
asr = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<2.4",
  "safetensors>=0.5,<1",
  "scipy>=1.15,<2",
  "sentencepiece>=0.2,<1",
  "soundfile>=0.13,<1",
  "torch==2.7.0",
  "torchaudio==2.7.0",
  "transformers>=4.57.3,<6",
]
vad = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<2.4",
  "onnxruntime>=1.22,<2",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
]
yolo = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<2.4",
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "opencv-python>=4.11,<5",
  "torch==2.7.0",
]
tts = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "kokoro==0.9.4",
  "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "misaki[en,ja,zh]>=0.9.4,<1",
  "numpy>=2,<2.4",
  "safetensors>=0.5,<1",
  "soundfile>=0.13,<1",
  "scipy>=1.15,<2",
  "torch==2.7.0",
  "torchaudio==2.7.0",
  "transformers>=4.57.3,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugging_mac_sdk"]

[tool.uv.sources]
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio.git", rev = "223afd602c6d583455bdb9f181b91fc090f4aff9" }
