[project]
name = "hugging-mac-sdk"
version = "0.1.0"
description = "Runtime-neutral model SDK for hugging-mac"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=0.33,<2",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/devilyouwei/hugging-mac"

[project.optional-dependencies]
yolo = [
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2,<2.4",
  "torch>=2.7,<3",
  "ultralytics>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugging_mac_sdk"]
